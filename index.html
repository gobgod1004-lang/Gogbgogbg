<script>
const SONG='song.mp3',FIRST=.65,PER=.4783,NN=324; // 음악 박자 분석값 (약 125 BPM)

function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const furTex=cv(512,512,(g,w,h)=>{g.fillStyle='#d9a468';g.fillRect(0,0,w,h);for(let i=0;i<9000;i++){const px=rnd()*w,py=rnd()*h,a=rnd()*6.28,l=5+rnd()*10;g.strokeStyle=rnd()<.5?'rgba(255,232,180,.3)':'rgba(90,50,15,.3)';g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);g.stroke()}});
const scaleTex=cv(256,512,(g,w,h)=>{const l=g.createLinearGradient(0,0,0,h);l.addColorStop(0,'#27e8c8');l.addColorStop(.5,'#1a86e0');l.addColorStop(1,'#8a3fe8');g.fillStyle=l;g.fillRect(0,0,w,h);

/* ---------- 무대 / 무지개 배경 ---------- */
const sky=new THREE.Mesh(new THREE.SphereGeometry(40,32,16),new THREE.MeshBasicMaterial({map:rainTex,side:THREE.BackSide,color:0x331144}));scene.add(sky);

const mkGr=(base,a,b,n,len)=>cv(512,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){g.strokeStyle=rnd()<.5?a:b;g.lineWidth=1.5;const x=rnd()*w,y=rnd()*h;g.beginPath();g.moveTo(x,y);g.lineTo(x+(rnd()-.5)*len,y-rnd()*len);g.stroke()}});
const mkGrid=(bgc,lc)=>cv(512,512,(g,w,h)=>{g.fillStyle=bgc;g.fillRect(0,0,w,h);g.strokeStyle=lc;g.lineWidth=3;for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(w,i*64);g.stroke()}});
const spaceSky=cv(1024,512,(g,w,h)=>{g.fillStyle='#03010c';g.fillRect(0,0,w,h);const cs=['rgba(120,60,255,.35)','rgba(255,60,160,.28)','rgba(40,160,255,.3)'];for(let i=0;i<14;i++){const x=rnd()*w,y=rnd()*h,r=80+rnd()*160,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,cs[i%3]);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)}for(let i=0;i<500;i++){g.fillStyle='rgba(255,255,255,'+(.3+rnd()*.7)+')';g.fillRect(rnd()*w,rnd()*h,1+rnd()*1.5,1+rnd()*1.5)}});
const candyFl=cv(512,512,(g)=>{for(let y=0;y<8;y++)for(let x=0;x<8;x++){g.fillStyle=(x+y)%2?'#ffc2e6':'#fff4fb';g.fillRect(x*64,y*64,64,64)}});
const BG=[
{fc:0x07030f,fd:.05,fe:.1,lc:null,amb:0x8a6aa8,sky:rainTex,fl:floorTex,gnd:null},
{fc:0xb4d4e4,fd:.018,fe:.05,lc:new THREE.Color(0xfff1c0),amb:0xd8ecff,sky:mkSky(['#2f7bf0','#7cc4ff','#dff3ff','#a9e08a','#3f8a30']),fl:mkGr('#4fae3a','rgba(160,230,90,.5)','rgba(25,90,25,.5)',9000,14),gnd:0x3f9a30},
{fc:0x1fa6c0,fd:.05,fe:.15,lc:new THREE.Color(0x7fdcff),amb:0x4fb0d0,sky:mkSky(['#04304f','#0a6b8f','#1fa6c0','#0a5f86','#03233c']),fl:mkGr('#e8d49a','rgba(255,245,200,.35)','rgba(160,130,80,.35)',6000,10),gnd:0xb59f6a},
{fc:0x3a2370,fd:.03,fe:.1,lc:new THREE.Color(0xb9b8ff),amb:0x5a58a8,sky:mkSky(['#04010f','#150a3a','#3a2370','#150a3a','#04010f']),fl:mkGr('#1a1740','rgba(110,100,220,.35)','rgba(10,8,40,.5)',5000,10),gnd:0x0d0a28},
{fc:0xe8bfd2,fd:.02,fe:.05,lc:new THREE.Color(0xffd0e8),amb:0xffd8ec,sky:mkSky(['#ff9ec8','#ffc9e0','#ffe9f2','#ffd0e8','#f08fb8']),fl:mkGr('#f6b3cc','rgba(255,225,240,.55)','rgba(210,110,150,.4)',9000,12),gnd:0xe9a3bb},
{fc:0x0b1a3a,fd:.03,fe:.1,lc:new THREE.Color(0x9fffe0),amb:0x4a6ac0,sky:mkSky(['#020615','#08204a','#0f4a5a','#08204a','#020615']),fl:mkGr('#cfe0ff','rgba(255,255,255,.6)','rgba(140,170,225,.5)',6000,8),gnd:0xc4d4f2},
{fc:0xffa970,fd:.02,fe:.06,lc:new THREE.Color(0xffc890),amb:0xffb894,sky:mkSky(['#2b1a4a','#a8396a','#ff8a4a','#ffd08a','#8a4a6a']),fl:mkGr('#efd3a0','rgba(255,240,200,.4)','rgba(190,150,100,.4)',6000,8),gnd:0xe0c08a},
{fc:0x02010a,fd:.012,fe:.3,lc:new THREE.Color(0xb0a0ff),amb:0x5a50b0,sky:spaceSky,fl:mkGrid('#0a0820','#5a4aff'),gnd:null},
{fc:0xffd0ec,fd:.02,fe:.08,lc:new THREE.Color(0xffe0f4),amb:0xffd0ec,sky:mkSky(['#ffa6e0','#ffd0f0','#c8f4ff','#fff0b8','#ffb0e0']),fl:candyFl,gnd:0xffa8d8},
{fc:0x0a0014,fd:.035,fe:.35,lc:new THREE.Color(0xff66cc),amb:0x4a2a7a,sky:mkSky(['#030008','#14002a','#030008']),fl:mkGrid('#0a0418','#ff3bb4'),gnd:0x08020f},
{fc:0x160a38,fd:.04,fe:.18,lc:new THREE.Color(0xb88cff),amb:0x6a4ab8,sky:mkSky(['#05020f','#1c0a3a','#0a0620']),fl:mkGr('#1a1038','rgba(150,110,255,.35)','rgba(10,5,30,.5)',5000,8),gnd:0x0e0722},
{fc:0x1a1410,fd:.03,fe:.14,lc:new THREE.Color(0xff9a50),amb:0x7a5a4a,sky:mkSky(['#050302','#2a1408','#5a2c10','#1a0c06']),fl:mkGrid('#1a1410','#ff7a1a'),gnd:0x1a1410}];
const seaC=new THREE.Color(0x8fe8ff);let bg=0;
const gnd=new THREE.Mesh(new THREE.CircleGeometry(60,48),new THREE.MeshBasicMaterial({color:0x3f9a30}));gnd.rotation.x=-Math.PI/2;gnd.position.y=-.02;scene.add(gnd);
const bgG=[null,...Array.from({length:11},()=>new THREE.Group())];bgG.forEach(g=>g&&scene.add(g));
const SG=r=>new THREE.SphereGeometry(r,16,12),ad=(g,m,p,par)=>{const x=new THREE.Mesh(g,m);x.position.set(...p);par.add(x);return x};
const LM=c=>new THREE.MeshLambertMaterial({color:c}),BM=(c,o={})=>new THREE.MeshBasicMaterial({color:c,fog:false,...o});
const mkPts=(n,fn,mat)=>{const a=new Float32Array(n*3),c=new Float32Array(n*3);for(let i=0;i<n;i++)fn(i,a,c);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));const p=new THREE.Points(g,mat);p.frustumCulled=false;return p};
const mkStars=()=>mkPts(700,(i,a)=>{const t=rnd()*6.283,y=.05+rnd()*.95,r=Math.sqrt(1-y*y)*35;a[i*3]=Math.cos(t)*r;a[i*3+1]=y*35;a[i*3+2]=Math.sin(t)*r},new THREE.PointsMaterial({size:2,sizeAttenuation:false,color:0xffffff,fog:false}));

function tree(par,x,z,s,tc,lc,pine){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);par.add(g);ad(new THREE.CylinderGeometry(.12,.16,1.2,8),LM(tc),[0,.6,0],g);

const clouds=[],weeds=[],fish=[],bub={v:new Float32Array(160)};let stars,ffl,st5;
{ // 초원
  const g=bgG[1];ad(new THREE.SphereGeometry(2.2,24,16),BM(0xfff2a0),[10,14,-30],g);
