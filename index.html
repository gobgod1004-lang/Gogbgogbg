<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헤드뱅잉 인어공주 3D</title>
<style>
html,body{margin:0;height:100%;background:#07030f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{pointer-events:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,3,15,.8);color:#ffe3f1;font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:24px}
#ov h1{font-size:clamp(30px,8vw,56px);margin:0;background:linear-gradient(90deg,#ff3b3b,#ffd23b,#3bff6a,#3bd2ff,#a63bff,#ff3bb4);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ff2d95)}
#ov p{margin:0;font-size:clamp(14px,3.6vw,18px);line-height:1.6;opacity:.92}
button{font:inherit;font-weight:800;font-size:22px;padding:14px 40px;border:0;border-radius:14px;color:#fff;background:linear-gradient(#ff5fae,#c4157a);box-shadow:0 6px 0 #7a0b4a,0 0 28px #ff2d9566;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #7a0b4a}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
<canvas id="hud"></canvas>
<div id="ov">
  <h1 id="t">헤드뱅잉 인어공주 3D</h1>
  <p id="m">공주 머리 주위로 손가락(마우스)을 둥글게 빙글빙글 드래그하면 머리가 돌아갑니다.<br>드래그하는 방향에 따라 인어공주가 온몸으로 춤을 춰요!<br>노래 박자가 칠 때 빠르게 돌고 있으면 콤보! 소리가 납니다.</p>
  <button id="b">시작</button>
</div>
<script>
const SONG='song.mp3',FIRST=.65,PER=.4783,NN=324; // 음악 박자 분석값 (약 125 BPM)
const $=id=>document.getElementById(id),rnd=Math.random;
const col=h=>new THREE.Color().setHSL(((h%1)+1)%1,1,.58);

/* ---------- 렌더러 / 씬 ---------- */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;
document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x07030f,.05);
const cam=new THREE.PerspectiveCamera(42,1,.1,100);
let comp,bloom;
if(THREE.EffectComposer&&THREE.UnrealBloomPass){comp=new THREE.EffectComposer(R);comp.addPass(new THREE.RenderPass(scene,cam));bloom=new THREE.UnrealBloomPass(new THREE.Vector2(512,512),.5,.5,.6);comp.addPass(bloom)}
const hud=$('hud'),hx=hud.getContext('2d');let W,H,DPR;
function rs(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);R.setSize(W,H);if(comp)comp.setSize(W,H);hud.width=W*DPR;hud.height=H*DPR;cam.aspect=W/H;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

/* ---------- 텍스처 ---------- */
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const furTex=cv(512,512,(g,w,h)=>{g.fillStyle='#d9a468';g.fillRect(0,0,w,h);for(let i=0;i<9000;i++){const px=rnd()*w,py=rnd()*h,a=rnd()*6.28,l=5+rnd()*10;g.strokeStyle=rnd()<.5?'rgba(255,232,180,.3)':'rgba(90,50,15,.3)';g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);g.stroke()}});
const scaleTex=cv(256,512,(g,w,h)=>{const l=g.createLinearGradient(0,0,0,h);l.addColorStop(0,'#27e8c8');l.addColorStop(.5,'#1a86e0');l.addColorStop(1,'#8a3fe8');g.fillStyle=l;g.fillRect(0,0,w,h);
  for(let y=0,r=0;y<h+20;y+=16,r++)for(let x=(r%2)*10-10;x<w+20;x+=20){g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1.6;g.beginPath();g.arc(x,y,11,.1,Math.PI-.1);g.stroke();g.fillStyle='rgba(255,255,255,.06)';g.fill()}});
const rainTex=cv(1024,512,(g,w,h)=>{const l=g.createLinearGradient(0,0,w,h);for(let i=0;i<=12;i++)l.addColorStop(i/12,`hsl(${i*30},100%,55%)`);g.fillStyle=l;g.fillRect(0,0,w,h)});
const floorTex=cv(512,512,(g,w,h)=>{if(g.createConicGradient){const c=g.createConicGradient(0,w/2,h/2);for(let i=0;i<=12;i++)c.addColorStop(i/12,`hsl(${i*30},100%,50%)`);g.fillStyle=c}else g.fillStyle='#f0a';g.fillRect(0,0,w,h)});
floorTex.center.set(.5,.5);

/* ---------- 무대 / 무지개 배경 ---------- */
const sky=new THREE.Mesh(new THREE.SphereGeometry(40,32,16),new THREE.MeshBasicMaterial({map:rainTex,side:THREE.BackSide,color:0x331144}));scene.add(sky);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3.4,64),new THREE.MeshStandardMaterial({map:floorTex,emissive:0xffffff,emissiveMap:floorTex,emissiveIntensity:.55,roughness:.25,metalness:.6}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const arcs=[];for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.TorusGeometry(2.4+i*.2,.1,12,80,Math.PI),new THREE.MeshBasicMaterial({color:col(i/7),transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));m.position.set(0,.1,-2.2);scene.add(m);arcs.push(m)}
const beams=[];for(let i=0;i<6;i++){const m=new THREE.Mesh(new THREE.CylinderGeometry(.05,.7,9,24,1,true),new THREE.MeshBasicMaterial({color:col(i/6),transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.position.set((i-2.5)*1.5,5,-3);scene.add(m);beams.push(m)}
scene.add(new THREE.AmbientLight(0x8a6aa8,1));
const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(2,5,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const pls=[0,1,2].map(i=>{const l=new THREE.PointLight(0xffffff,2,12);scene.add(l);return l});

/* ---------- 공주 ---------- */
const pr=new THREE.Group();scene.add(pr);
const M=(o)=>new THREE.MeshPhysicalMaterial(o),mesh=(g,m,p=[0,0,0],par=pr)=>{const x=new THREE.Mesh(g,m);x.position.set(...p);x.castShadow=true;par.add(x);return x};
const SP=(r)=>new THREE.SphereGeometry(r,32,24);
const skin=M({color:0xf2bf9c,roughness:.5,clearcoat:.25});
const tailG=new THREE.Group();tailG.position.y=1.05;pr.add(tailG);
const prof=[];for(let i=0;i<=16;i++){const u=i/16;prof.push(new THREE.Vector2(.03+.21*Math.pow(1-u,.8)*(1+.25*Math.sin(u*3.1)),1.05-u*1.0))}
const tailMat=M({map:scaleTex,roughness:.3,metalness:.35,clearcoat:1,clearcoatRoughness:.15,emissive:0x0a2a5a,emissiveIntensity:.4});
const tl=mesh(new THREE.LatheGeometry(prof,48),tailMat,[0,-1.05,0],tailG);
for(const s of[-1,1]){const f=mesh(SP(.3),tailMat,[s*.22,-.98,0],tailG);f.scale.set(1,.7,.07);f.rotation.z=s*-.7}
mesh(new THREE.CylinderGeometry(.2,.17,.5,32),skin,[0,1.3,0]);
const pearl=M({color:0xffd8ec,roughness:.15,metalness:.6,clearcoat:1,emissive:0xff3b9a,emissiveIntensity:.35});
for(const s of[-1,1])mesh(SP(.1),pearl,[s*.09,1.4,.12]);
const arms=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.25,1.5,0);pr.add(g);mesh(new THREE.CylinderGeometry(.045,.04,.42,16),skin,[0,-.21,0],g);mesh(SP(.06),skin,[0,-.44,0],g);return g});
const neck=new THREE.Group();neck.position.set(0,1.56,0);pr.add(neck);
const hd=new THREE.Group();hd.position.y=.27;neck.add(hd);
const fm=M({map:furTex,bumpMap:furTex,bumpScale:1.5,roughness:.85}),mz=M({map:furTex,color:0xffe9cc,roughness:.8});
const hs=mesh(SP(.27),fm,[0,0,0],hd);hs.scale.set(1,1.05,1);
const sn=mesh(SP(.13),mz,[0,-.06,.25],hd);sn.scale.set(1,.8,1.35);
const dark=M({color:0x080606,roughness:.15,clearcoat:1});
mesh(SP(.045),dark,[0,-.01,.4],hd);
for(const s of[-1,1]){mesh(SP(.042),dark,[s*.1,.07,.23],hd);mesh(SP(.012),new THREE.MeshBasicMaterial({color:0xffffff}),[s*.1+.012,.085,.265],hd)}
const tg=mesh(SP(.06),M({color:0xe0507a,roughness:.4,clearcoat:.6}),[0,-.17,.31],hd);tg.scale.set(.8,.4,1.2);
const earMat=M({map:furTex,color:0x8a5526,roughness:.9});
const ears=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.23,.1,0);hd.add(g);const e=mesh(SP(.08),earMat,[s*.04,-.14,0],g);e.scale.set(.55,1.9,1);return g});
const gold=M({color:0xffc83a,metalness:1,roughness:.2,emissive:0x553300,emissiveIntensity:.4});
for(let i=0;i<5;i++){const a=i/5*6.283,c=mesh(new THREE.ConeGeometry(.04,.14,8),gold,[Math.sin(a)*.12,.31,Math.cos(a)*.12-.03],hd)}

/* ---------- 긴 분홍 머리카락: 물리(베를레) 체인 + 리본 메시 ---------- */
const NS=96,SEG=22,SL=.082; // 가닥 수, 마디 수, 마디 길이 (총 길이 약 1.7)
const strands=[];
for(let i=0;i<NS;i++){
  const th=Math.PI*(.28+1.44*(i/(NS-1)))+(rnd()-.5)*.14,e=.05+rnd()*1.35;
  const n=new THREE.Vector3(Math.cos(e)*Math.sin(th),Math.sin(e),Math.cos(e)*Math.cos(th));
  strands.push({rl:n.clone().multiply(new THREE.Vector3(.27,.284,.27)),dl:n.clone().add(new THREE.Vector3(0,-.9,0)).normalize(),
    P:new Float32Array(SEG*3),Q:new Float32Array(SEG*3),sl:SL*(.82+rnd()*.22),ph:rnd()*6,hue:rnd()*.1,w:.85+rnd()*.5,init:false});
}
const hpos=new Float32Array(NS*SEG*6),hcol=new Float32Array(NS*SEG*6),hidx=[];
for(let s=0;s<NS;s++)for(let k=0;k<SEG-1;k++){const a=(s*SEG+k)*2;hidx.push(a,a+1,a+2,a+1,a+3,a+2)}
const hg=new THREE.BufferGeometry();hg.setAttribute('position',new THREE.BufferAttribute(hpos,3));hg.setAttribute('color',new THREE.BufferAttribute(hcol,3));hg.setIndex(hidx);
const hairMesh=new THREE.Mesh(hg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}));hairMesh.frustumCulled=false;scene.add(hairMesh);
/* 머리카락이 몸/머리를 뚫지 않게 하는 충돌 구 */
const colls=[],cl=(par,y,r)=>{const o=new THREE.Object3D();o.position.y=y;par.add(o);colls.push({o,p:new THREE.Vector3(),r,k:2})};
cl(pr,1.45,.2);cl(pr,1.3,.23);cl(pr,1.15,.27);cl(tailG,-.15,.26);cl(tailG,-.35,.23);cl(tailG,-.55,.2);
colls.push({o:hd,p:new THREE.Vector3(),r:.29,k:3});
const tA=new THREE.Vector3(),tD=new THREE.Vector3(),tC=new THREE.Color();
function stepHair(dt,T){
  pr.updateMatrixWorld(true);
  for(const c of colls)c.o.getWorldPosition(c.p);
  const n=2,h=Math.min(dt,.033)/n,g=-9*h*h,dm=Math.pow(.22,h),fl=2.2*h*h;
  for(const s of strands){
    const P=s.P,Q=s.Q,sl=s.sl;
    tA.copy(s.rl).applyMatrix4(hd.matrixWorld);tD.copy(s.dl).transformDirection(hd.matrixWorld);
    if(!s.init){s.init=true;for(let k=0;k<SEG;k++){const i=k*3,f=Math.min(k,1),d=Math.max(0,k-1);
      P[i]=Q[i]=tA.x+tD.x*sl*f;P[i+1]=Q[i+1]=tA.y+tD.y*sl*f-sl*d;P[i+2]=Q[i+2]=tA.z+tD.z*sl*f}}
    for(let it=0;it<n;it++){
      P[0]=tA.x;P[1]=tA.y;P[2]=tA.z;P[3]=tA.x+tD.x*sl;P[4]=tA.y+tD.y*sl;P[5]=tA.z+tD.z*sl;
      for(let k=2;k<SEG;k++){const i=k*3;
        for(let c=0;c<3;c++){const v=(P[i+c]-Q[i+c])*dm;Q[i+c]=P[i+c];P[i+c]+=v}
        P[i+1]+=g;P[i]+=Math.sin(T*3.1+s.ph+k*.6)*fl;P[i+2]+=Math.cos(T*2.3+s.ph*1.3+k*.5)*fl}
      for(let r=0;r<4;r++)for(let k=2;k<SEG;k++){const i=k*3,j=i-3;
        let dx=P[i]-P[j],dy=P[i+1]-P[j+1],dz=P[i+2]-P[j+2];const d=Math.hypot(dx,dy,dz)||1e-6,f=(d-sl)/d,w=k<=2?1:.5;
        P[i]-=dx*f*w;P[i+1]-=dy*f*w;P[i+2]-=dz*f*w;if(k>2){P[j]+=dx*f*.5;P[j+1]+=dy*f*.5;P[j+2]+=dz*f*.5}
        if(r===0&&k>2){const st=.02+.14*(1-k/SEG),b=j-3;
          P[i]+=(2*P[j]-P[b]-P[i])*st;P[i+1]+=(2*P[j+1]-P[b+1]-P[i+1])*st;P[i+2]+=(2*P[j+2]-P[b+2]-P[i+2])*st}}
      for(const c of colls){const r2=c.r*c.r;for(let k=c.k;k<SEG;k++){const i=k*3,dx=P[i]-c.p.x,dy=P[i+1]-c.p.y,dz=P[i+2]-c.p.z,d2=dx*dx+dy*dy+dz*dz;
        if(d2<r2&&d2>1e-8){const f=c.r/Math.sqrt(d2);P[i]=c.p.x+dx*f;P[i+1]=c.p.y+dy*f;P[i+2]=c.p.z+dz*f}}}
      for(let k=2;k<SEG;k++)if(P[k*3+1]<.03)P[k*3+1]=.03;
    }
  }
  /* 카메라를 향하는 리본으로 변환 + 색(핑크 → 끝은 무지개) */
  let o=0;
  for(const s of strands){const P=s.P;
    for(let k=0;k<SEG;k++){const i=k*3,a=Math.max(k-1,0)*3,b=Math.min(k+1,SEG-1)*3,u=k/(SEG-1);
      const tx=P[b]-P[a],ty=P[b+1]-P[a+1],tz=P[b+2]-P[a+2],vx=cam.position.x-P[i],vy=cam.position.y-P[i+1],vz=cam.position.z-P[i+2];
      let sx=ty*vz-tz*vy,sy=tz*vx-tx*vz,sz=tx*vy-ty*vx;const l=Math.hypot(sx,sy,sz)||1,w=(.034*(1-.75*u)+.004)*s.w/l;sx*=w;sy*=w;sz*=w;
      hpos[o]=P[i]-sx;hpos[o+1]=P[i+1]-sy;hpos[o+2]=P[i+2]-sz;hpos[o+3]=P[i]+sx;hpos[o+4]=P[i+1]+sy;hpos[o+5]=P[i+2]+sz;
      const sh=(.5+.5*Math.min(1,u*4))*(.8+.3*Math.sin(u*9-T*2.5+s.ph))*.95,m=Math.max(0,(u-.5)*2);
      tC.setHSL((T*.5+u*.6+s.hue)%1,1,.6);
      const r=(1+(tC.r-1)*m)*sh,gg=(.3+(tC.g-.3)*m)*sh,bb=(.65+(tC.b-.65)*m)*sh;
      hcol[o]=hcol[o+3]=r;hcol[o+1]=hcol[o+4]=gg;hcol[o+2]=hcol[o+5]=bb;o+=6}}
  hg.attributes.position.needsUpdate=hg.attributes.color.needsUpdate=true;
}

/* ---------- 이펙트: 파티클 / 링 ---------- */
const PN=3000,pp=new Float32Array(PN*3),pc=new Float32Array(PN*3),pb=new Float32Array(PN*3),pv=new Float32Array(PN*3),pl=new Float32Array(PN);let pi=0;
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));pg.setAttribute('color',new THREE.BufferAttribute(pc,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.07,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));pts.frustumCulled=false;scene.add(pts);
function emit(n,p,sp){for(let k=0;k<n;k++){const i=pi++%PN,c=col(rnd()),a=rnd()*6.28,b=rnd()*3.1-1.2,s=sp*(.4+rnd());
  pp[i*3]=p.x;pp[i*3+1]=p.y;pp[i*3+2]=p.z;pv[i*3]=Math.cos(a)*Math.cos(b)*s;pv[i*3+1]=Math.sin(b)*s+1;pv[i*3+2]=Math.sin(a)*Math.cos(b)*s;
  pb[i*3]=c.r;pb[i*3+1]=c.g;pb[i*3+2]=c.b;pl[i]=1}}
const rg=[],tor=new THREE.TorusGeometry(1,.035,8,72);
function ring(p,h,sp){const m=new THREE.Mesh(tor,new THREE.MeshBasicMaterial({color:col(h),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.position.copy(p);m.userData.sp=sp;scene.add(m);rg.push(m)}

/* ---------- 오디오 ---------- */
let A,an,buf,src,tS=0,fq,dur=0;
async function load(){if(buf)return;const r=await fetch(SONG);buf=await A.decodeAudioData(await r.arrayBuffer());dur=buf.duration}

/* ---------- 게임 상태 ---------- */
let sc=0,combo=0,maxc=0,cnt={p:0,g:0,m:0},pops=[],run=false,spin=0,om=0,drag=false,lastA=0,lastT=0,trail=[],kick=0,flash=0,en=0,enS=0,eAvg=0,lastOn=-9,scX=300,scY=300;
let tdx=0,tdy=0,dxs=0,dys=0; // 드래그 위치(화면 중심 기준) → 춤 동작
async function start(){
  const b=$('b');b.textContent='불러오는 중…';b.disabled=true;
  try{A=A||new(window.AudioContext||window.webkitAudioContext)();await A.resume();await load()}catch(e){b.textContent='음악 로드 실패 (song.mp3 확인)';b.disabled=false;return}
  an=A.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.3;fq=new Uint8Array(an.frequencyBinCount);
  src=A.createBufferSource();src.buffer=buf;src.connect(an);an.connect(A.destination);tS=A.currentTime+1;src.start(tS);
  sc=0;combo=0;maxc=0;cnt={p:0,g:0,m:0};pops=[];om=0;run=true;b.disabled=false;$('ov').style.display='none'}
const sT=()=>A.currentTime-tS;
function pop(s,c){pops.push({s,c,a:1,y:0})}
const wrap=d=>d>Math.PI?d-6.2832:d<-Math.PI?d+6.2832:d;
const setD=e=>{tdx=(e.clientX/W-.5)*2.4;tdy=(e.clientY/H-.5)*2};
addEventListener('pointerdown',e=>{if(e.target.closest('#ov'))return;drag=true;lastA=Math.atan2(e.clientY-scY,e.clientX-scX);lastT=performance.now();trail=[];setD(e)});
addEventListener('pointermove',e=>{if(!drag)return;setD(e);const a=Math.atan2(e.clientY-scY,e.clientX-scX),n=performance.now(),d=wrap(a-lastA),dt=Math.max(.008,(n-lastT)/1000);
  om+=(Math.max(-40,Math.min(40,d/dt))-om)*.3;spin+=d;lastA=a;lastT=n;trail.push({x:e.clientX,y:e.clientY,t:n});if(trail.length>40)trail.shift()});
const up=()=>{drag=false;tdx=tdy=0};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
$('b').onclick=start;

/* ---------- 메인 루프 ---------- */
const clock=new THREE.Clock(),hw=new THREE.Vector3(),v3=new THREE.Vector3();
let hpx=0,hvx=0,hpz=0,hvz=0,hsx=0,hsvx=0,hsz=0,hsvz=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta()),T=clock.elapsedTime,tm=run?sT():0,now=A?A.currentTime:T;
  if(an){an.getByteFrequencyData(fq);let s=0;for(let i=0;i<4;i++)s+=fq[i];en=s/4/255}else en=.25;

  for(let i=0;i<PN;i++)if(pl[i]>0){pl[i]-=dt*.6;pv[i*3+1]-=3*dt;for(let k=0;k<3;k++){pp[i*3+k]+=pv[i*3+k]*dt;pc[i*3+k]=pb[i*3+k]*Math.max(0,pl[i])*.7}}else{pc[i*3]=pc[i*3+1]=pc[i*3+2]=0}
  pg.attributes.position.needsUpdate=pg.attributes.color.needsUpdate=true;
  arcs.forEach((a,i)=>{a.material.color.copy(col(i/7+T*.2));a.material.opacity=.25+.25*enS+kick*.1});
  beams.forEach((b,i)=>{b.material.color.copy(col(i/6+T*.3));b.material.opacity=.04+.08*enS+flash*.03;b.rotation.z=Math.sin(T*1.1+i*1.1)*.7;b.rotation.x=Math.cos(T*.8+i)*.3});

  hx.fillStyle='#fff';hx.font=`800 ${Math.max(22,u*34)}px "Apple SD Gothic Neo",sans-serif`;hx.fillText(String(Math.floor(sc)).padStart(6,'0'),W/2,Math.max(40,u*50));
  if(combo>1){hx.fillStyle=`hsl(${(n/4)%360},100%,65%)`;hx.font=`800 ${Math.max(18,u*28)*(1+flash*.2)}px "Apple SD Gothic Neo",sans-serif`;hx.fillText(combo+' 콤보',W/2,Math.max(72,u*88))}
  if(run&&dur){hx.shadowBlur=0;hx.fillStyle='rgba(255,255,255,.15)';hx.fillRect(0,0,W,4);hx.fillStyle='#ff5fae';hx.fillRect(0,0,W*Math.max(0,Math.min(1,tm/dur)),4)}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.a-=.03;p.y+=1.5;if(p.a<=0){pops.splice(i,1);continue}hx.globalAlpha=p.a;hx.fillStyle=p.c;hx.shadowBlur=6;hx.font=`800 ${u*38}px "Apple SD Gothic Neo",sans-serif`;hx.fillText(p.s,cx,cy-Math.min(W,H)*.2-p.y);hx.globalAlpha=1}
  hx.shadowBlur=0}
