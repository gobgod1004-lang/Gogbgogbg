<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헤드뱅잉 인어공주 3D</title>
<style>
html,body{margin:0;height:100%;background:#07030f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{pointer-events:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,3,15,.8);color:#ffe3f1;font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:24px}
#ov h1{font-size:clamp(30px,8vw,56px);margin:0;background:linear-gradient(90deg,#ff3b3b,#ffd23b,#3bff6a,#3bd2ff,#a63bff,#ff3bb4);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ff2d95)}
#ov p{margin:0;font-size:clamp(14px,3.6vw,18px);line-height:1.6;opacity:.92}
button{font:inherit;font-weight:800;font-size:22px;padding:14px 40px;border:0;border-radius:14px;color:#fff;background:linear-gradient(#ff5fae,#c4157a);box-shadow:0 6px 0 #7a0b4a,0 0 28px #ff2d9566;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #7a0b4a}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#ui>*{pointer-events:auto}
#pn{width:min(560px,100%);box-sizing:border-box;background:rgba(7,3,15,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;color:#ffe3f1;font-size:13px}
#pn .r{display:flex;align-items:center;gap:8px}#pn .r>span{flex:none;width:44px;opacity:.8}
#pn .c{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#ui button{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap;background:rgba(255,255,255,.16);box-shadow:none;flex:none}
#ui button.on{background:linear-gradient(#ff5fae,#c4157a)}
#ui button:active{transform:none;box-shadow:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
<canvas id="hud"></canvas>
<div id="ui"><div id="pn"></div><button id="tg">🎨 꾸미기</button></div>
<div id="ov">
  <h1 id="t">헤드뱅잉 인어공주 3D</h1>
  <p id="m">공주 머리 주위로 손가락(마우스)을 빙글빙글 드래그하면 머리가 돌아가요.<br>드래그하는 대로 인어공주가 온몸으로 춤을 춰요!<br>아래 🎨 버튼으로 배경·머리·옷을 바꿔 보세요.</p>
  <button id="b">시작</button>
</div>
<script>
const SONG='song.mp3',FIRST=.65,PER=.4783,NN=324; // 음악 박자 분석값 (약 125 BPM)
const $=id=>document.getElementById(id),rnd=Math.random;
const col=h=>new THREE.Color().setHSL(((h%1)+1)%1,1,.58);

/* ---------- 렌더러 / 씬 ---------- */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;
document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x07030f,.05);
const cam=new THREE.PerspectiveCamera(42,1,.1,100);
let comp,bloom;
if(THREE.EffectComposer&&THREE.UnrealBloomPass){comp=new THREE.EffectComposer(R);comp.addPass(new THREE.RenderPass(scene,cam));bloom=new THREE.UnrealBloomPass(new THREE.Vector2(512,512),.5,.5,.6);comp.addPass(bloom)}
const hud=$('hud'),hx=hud.getContext('2d');let W,H,DPR;
function rs(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);R.setSize(W,H);if(comp)comp.setSize(W,H);hud.width=W*DPR;hud.height=H*DPR;cam.aspect=W/H;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

/* ---------- 텍스처 ---------- */
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const furTex=cv(512,512,(g,w,h)=>{g.fillStyle='#d9a468';g.fillRect(0,0,w,h);for(let i=0;i<9000;i++){const px=rnd()*w,py=rnd()*h,a=rnd()*6.28,l=5+rnd()*10;g.strokeStyle=rnd()<.5?'rgba(255,232,180,.3)':'rgba(90,50,15,.3)';g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);g.stroke()}});
const scaleTex=cv(256,512,(g,w,h)=>{const l=g.createLinearGradient(0,0,0,h);l.addColorStop(0,'#27e8c8');l.addColorStop(.5,'#1a86e0');l.addColorStop(1,'#8a3fe8');g.fillStyle=l;g.fillRect(0,0,w,h);
  for(let y=0,r=0;y<h+20;y+=16,r++)for(let x=(r%2)*10-10;x<w+20;x+=20){g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1.6;g.beginPath();g.arc(x,y,11,.1,Math.PI-.1);g.stroke();g.fillStyle='rgba(255,255,255,.06)';g.fill()}});
const rainTex=cv(1024,512,(g,w,h)=>{const l=g.createLinearGradient(0,0,w,h);for(let i=0;i<=12;i++)l.addColorStop(i/12,`hsl(${i*30},100%,55%)`);g.fillStyle=l;g.fillRect(0,0,w,h)});
const floorTex=cv(512,512,(g,w,h)=>{if(g.createConicGradient){const c=g.createConicGradient(0,w/2,h/2);for(let i=0;i<=12;i++)c.addColorStop(i/12,`hsl(${i*30},100%,50%)`);g.fillStyle=c}else g.fillStyle='#f0a';g.fillRect(0,0,w,h)});
floorTex.center.set(.5,.5);

/* ---------- 무대 / 무지개 배경 ---------- */
const sky=new THREE.Mesh(new THREE.SphereGeometry(40,32,16),new THREE.MeshBasicMaterial({map:rainTex,side:THREE.BackSide,color:0x331144}));scene.add(sky);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3.4,64),new THREE.MeshStandardMaterial({map:floorTex,emissive:0xffffff,emissiveMap:floorTex,emissiveIntensity:.55,roughness:.25,metalness:.6}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const arcs=[];for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.TorusGeometry(2.4+i*.2,.1,12,80,Math.PI),new THREE.MeshBasicMaterial({color:col(i/7),transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));m.position.set(0,.1,-2.2);scene.add(m);arcs.push(m)}
const beams=[];for(let i=0;i<6;i++){const m=new THREE.Mesh(new THREE.CylinderGeometry(.05,.7,9,24,1,true),new THREE.MeshBasicMaterial({color:col(i/6),transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.position.set((i-2.5)*1.5,5,-3);scene.add(m);beams.push(m)}
const amb=new THREE.AmbientLight(0x8a6aa8,1);scene.add(amb);
const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(2,5,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const pls=[0,1,2].map(i=>{const l=new THREE.PointLight(0xffffff,2,12);scene.add(l);return l});

/* ---------- 배경 (무지개 / 초원 / 바닷속 / 밤하늘) ---------- */
const mkSky=c=>cv(8,256,(g,w,h)=>{const l=g.createLinearGradient(0,0,0,h);c.forEach((x,i)=>l.addColorStop(i/(c.length-1),x));g.fillStyle=l;g.fillRect(0,0,w,h)});
const mkGr=(base,a,b,n,len)=>cv(512,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){g.strokeStyle=rnd()<.5?a:b;g.lineWidth=1.5;const x=rnd()*w,y=rnd()*h;g.beginPath();g.moveTo(x,y);g.lineTo(x+(rnd()-.5)*len,y-rnd()*len);g.stroke()}});
const BG=[
{fc:0x07030f,fd:.05,fe:.1,lc:null,amb:0x8a6aa8,sky:rainTex,fl:floorTex,gnd:null},
{fc:0xdff3ff,fd:.018,fe:.14,lc:new THREE.Color(0xfff1c0),amb:0xd8ecff,sky:mkSky(['#2f7bf0','#7cc4ff','#dff3ff','#a9e08a','#3f8a30']),fl:mkGr('#4fae3a','rgba(160,230,90,.5)','rgba(25,90,25,.5)',9000,14),gnd:0x3f9a30},
{fc:0x1fa6c0,fd:.05,fe:.15,lc:new THREE.Color(0x7fdcff),amb:0x4fb0d0,sky:mkSky(['#04304f','#0a6b8f','#1fa6c0','#0a5f86','#03233c']),fl:mkGr('#e8d49a','rgba(255,245,200,.35)','rgba(160,130,80,.35)',6000,10),gnd:0xb59f6a},
{fc:0x3a2370,fd:.03,fe:.1,lc:new THREE.Color(0xb9b8ff),amb:0x5a58a8,sky:mkSky(['#04010f','#150a3a','#3a2370','#150a3a','#04010f']),fl:mkGr('#1a1740','rgba(110,100,220,.35)','rgba(10,8,40,.5)',5000,10),gnd:0x0d0a28}];
const seaC=new THREE.Color(0x8fe8ff);let bg=0;
const gnd=new THREE.Mesh(new THREE.CircleGeometry(60,48),new THREE.MeshBasicMaterial({color:0x3f9a30}));gnd.rotation.x=-Math.PI/2;gnd.position.y=-.02;scene.add(gnd);
const bgG=[null,new THREE.Group(),new THREE.Group(),new THREE.Group()];bgG.forEach(g=>g&&scene.add(g));
const SG=r=>new THREE.SphereGeometry(r,16,12),ad=(g,m,p,par)=>{const x=new THREE.Mesh(g,m);x.position.set(...p);par.add(x);return x};
const LM=c=>new THREE.MeshLambertMaterial({color:c}),BM=(c,o={})=>new THREE.MeshBasicMaterial({color:c,fog:false,...o});
const mkPts=(n,fn,mat)=>{const a=new Float32Array(n*3),c=new Float32Array(n*3);for(let i=0;i<n;i++)fn(i,a,c);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));const p=new THREE.Points(g,mat);p.frustumCulled=false;return p};
function tree(par,x,z,s,tc,lc,pine){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);par.add(g);ad(new THREE.CylinderGeometry(.12,.16,1.2,8),LM(tc),[0,.6,0],g);
  if(pine){ad(new THREE.ConeGeometry(.8,1.6,10),LM(lc),[0,1.9,0],g);ad(new THREE.ConeGeometry(.6,1.2,10),LM(lc),[0,2.7,0],g)}else ad(SG(.85),LM(lc),[0,1.8,0],g)}
const clouds=[],weeds=[],fish=[],bub={v:new Float32Array(160)};let stars,ffl;
{ // 초원
  const g=bgG[1];ad(new THREE.SphereGeometry(2.2,24,16),BM(0xfff2a0),[10,14,-30],g);
  [[-14,-5,-16,9],[13,-6,-20,10],[0,-8,-28,13],[-26,-6,-4,10],[27,-6,-6,10]].forEach(([x,y,z,r],i)=>ad(new THREE.SphereGeometry(r,24,16),LM(i%2?0x3fa032:0x4dbb3c),[x,y,z],g));
  [[-5,-7],[-8,-4],[6,-8],[8,-5],[-3,-11],[3,-12],[10,-10]].forEach(([x,z],i)=>tree(g,x,z,1.2+i%3*.2,0x7a4a24,0x2f9a3a,false));
  for(let i=0;i<6;i++){const c=new THREE.Group();c.position.set(-30+i*12,9+rnd()*5,-22-rnd()*8);g.add(c);[[0,0,1.8],[1.8,-.3,2.3],[-1.8,-.2,1.6]].forEach(([x,y,r])=>ad(SG(r),BM(0xffffff,{transparent:true,opacity:.92}),[x,y,0],c));clouds.push(c)}
  const FC=[[1,.4,.6],[1,.9,.3],[1,1,1],[.7,.5,1],[1,.6,.2]];
  g.add(mkPts(500,(i,a,c)=>{const r=1+Math.pow(rnd(),.7)*10,t=rnd()*6.283,k=FC[i%5];a[i*3]=Math.cos(t)*r;a[i*3+1]=.05;a[i*3+2]=Math.sin(t)*r;c[i*3]=k[0];c[i*3+1]=k[1];c[i*3+2]=k[2]},new THREE.PointsMaterial({size:.14,vertexColors:true})));
}
{ // 바닷속
  const g=bgG[2];
  bub.p=mkPts(160,(i,a)=>{a[i*3]=(rnd()-.5)*10;a[i*3+1]=rnd()*7;a[i*3+2]=rnd()*8-5;bub.v[i]=.3+rnd()*.7},new THREE.PointsMaterial({size:.1,color:0xcff6ff,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(bub.p);
  const cc=[0xff6f91,0xff9a4d,0xb36bff,0xff5fae];
  for(let i=0;i<14;i++){const t=rnd()*6.283,r=4+rnd()*3;for(let k=0;k<3;k++){const h=.8+rnd()*1.2;ad(new THREE.ConeGeometry(.15+rnd()*.15,h,7),LM(cc[i%4]),[Math.cos(t)*r+(rnd()-.5)*.5,h/2,Math.sin(t)*r+(rnd()-.5)*.5],g)}}
  const wg=new THREE.CylinderGeometry(.03,.07,2.4,6);wg.translate(0,1.2,0);
  for(let i=0;i<16;i++){const t=rnd()*6.283,r=3.6+rnd()*3,w=ad(wg,LM(0x2fbf6a),[Math.cos(t)*r,0,Math.sin(t)*r],g);w.userData.ph=rnd()*6;weeds.push(w)}
  const fc=[0xff9a3b,0xffe14a,0x4fd8ff,0xff5f8a];
  for(let i=0;i<7;i++){const f=new THREE.Group(),m=LM(fc[i%4]);ad(SG(1),m,[0,0,0],f).scale.set(.22,.12,.07);const tl=ad(new THREE.ConeGeometry(.1,.2,6),m,[-.3,0,0],f);tl.rotation.z=-Math.PI/2;
    f.userData={a0:rnd()*6.28,sp:.15+rnd()*.2,r:3.5+rnd()*2,y:1+rnd()*2};g.add(f);fish.push(f)}
}
{ // 밤하늘
  const g=bgG[3];
  stars=mkPts(700,(i,a)=>{const t=rnd()*6.283,y=.05+rnd()*.95,r=Math.sqrt(1-y*y)*35;a[i*3]=Math.cos(t)*r;a[i*3+1]=y*35;a[i*3+2]=Math.sin(t)*r},new THREE.PointsMaterial({size:2,sizeAttenuation:false,color:0xffffff,fog:false}));g.add(stars);
  ad(new THREE.SphereGeometry(2.5,24,16),BM(0xfff6d8),[-14,12,-28],g);ad(new THREE.SphereGeometry(4.5,24,16),BM(0xfff6d8,{transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false}),[-14,12,-28],g);
  for(let i=0;i<9;i++){const t=Math.PI*(.55+.9*rnd()),r=6+rnd()*5;tree(g,Math.cos(t)*r,Math.sin(t)*r-4,1.2+rnd()*.5,0x1b1030,0x0e2a3a,true)}
  ffl=mkPts(60,(i,a)=>{a[i*3]=(rnd()-.5)*10;a[i*3+1]=.3+rnd()*2.5;a[i*3+2]=rnd()*8-6},new THREE.PointsMaterial({size:.12,color:0xd8ff6a,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(ffl);
}
function bgAnim(T,dt){
  if(bg===1)clouds.forEach(c=>{c.position.x+=dt*.4;if(c.position.x>40)c.position.x=-40});
  else if(bg===2){const q=bub.p.geometry.attributes.position.array;for(let i=0;i<160;i++){q[i*3+1]+=bub.v[i]*dt;q[i*3]+=Math.sin(T+i)*.003;if(q[i*3+1]>7)q[i*3+1]=0}bub.p.geometry.attributes.position.needsUpdate=true;
    weeds.forEach(w=>{w.rotation.z=Math.sin(T*1.2+w.userData.ph)*.18;w.rotation.x=Math.cos(T*.9+w.userData.ph)*.12});
    fish.forEach(f=>{const u=f.userData,a=u.a0+T*u.sp;f.position.set(Math.cos(a)*u.r,u.y+Math.sin(T+u.a0)*.2,Math.sin(a)*u.r);f.rotation.y=-(a+Math.PI/2)})}
  else if(bg===3){stars.rotation.y=T*.01;const q=ffl.geometry.attributes.position.array;for(let i=0;i<60;i++){q[i*3]+=Math.sin(T*.7+i)*.004;q[i*3+1]+=Math.cos(T*.9+i*1.3)*.004;q[i*3+2]+=Math.sin(T*.5+i*2)*.004}ffl.geometry.attributes.position.needsUpdate=true}
}
function setBg(i){bg=i;const b=BG[i];scene.fog.color.setHex(b.fc);scene.fog.density=b.fd;sky.material.map=b.sky;sky.material.fog=(i===0);sky.material.needsUpdate=true;
  const fm=floor.material;fm.map=fm.emissiveMap=b.fl;fm.metalness=i?.05:.6;fm.roughness=i?.85:.25;fm.needsUpdate=true;
  gnd.visible=!!b.gnd;if(b.gnd)gnd.material.color.setHex(b.gnd);bgG.forEach((g,j)=>g&&(g.visible=j===i));
  arcs.forEach(a=>a.visible=i===0);beams.forEach(m=>m.visible=i===0||i===2);amb.color.setHex(b.amb)}

/* ---------- 공주 ---------- */
const pr=new THREE.Group();scene.add(pr);
const M=(o)=>new THREE.MeshPhysicalMaterial(o),mesh=(g,m,p=[0,0,0],par=pr)=>{const x=new THREE.Mesh(g,m);x.position.set(...p);x.castShadow=true;par.add(x);return x};
const SP=(r)=>new THREE.SphereGeometry(r,32,24);
const skin=M({color:0xf2bf9c,roughness:.5,clearcoat:.25});
const tailG=new THREE.Group();tailG.position.y=1.05;pr.add(tailG);
const prof=[];for(let i=0;i<=16;i++){const u=i/16;prof.push(new THREE.Vector2(.03+.21*Math.pow(1-u,.8)*(1+.25*Math.sin(u*3.1)),1.05-u*1.0))}
const tailMat=M({map:scaleTex,roughness:.3,metalness:.35,clearcoat:1,clearcoatRoughness:.15,emissive:0x0a2a5a,emissiveIntensity:.4});
const tl=mesh(new THREE.LatheGeometry(prof,48),tailMat,[0,-1.05,0],tailG);
for(const s of[-1,1]){const f=mesh(SP(.3),tailMat,[s*.22,-.98,0],tailG);f.scale.set(1,.7,.07);f.rotation.z=s*-.7}
mesh(new THREE.CylinderGeometry(.2,.17,.5,32),skin,[0,1.3,0]);
const pearl=M({color:0xffd8ec,roughness:.15,metalness:.6,clearcoat:1,emissive:0xff3b9a,emissiveIntensity:.35});
for(const s of[-1,1])mesh(SP(.1),pearl,[s*.09,1.4,.12]);
const arms=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.25,1.5,0);pr.add(g);mesh(new THREE.CylinderGeometry(.045,.04,.42,16),skin,[0,-.21,0],g);mesh(SP(.06),skin,[0,-.44,0],g);return g});
const neck=new THREE.Group();neck.position.set(0,1.56,0);pr.add(neck);
const hd=new THREE.Group();hd.position.y=.27;neck.add(hd);
const fm=M({map:furTex,bumpMap:furTex,bumpScale:1.5,roughness:.85}),mz=M({map:furTex,color:0xffe9cc,roughness:.8});
const hs=mesh(SP(.27),fm,[0,0,0],hd);hs.scale.set(1,1.05,1);
const sn=mesh(SP(.13),mz,[0,-.06,.25],hd);sn.scale.set(1,.8,1.35);
const dark=M({color:0x080606,roughness:.15,clearcoat:1});
mesh(SP(.045),dark,[0,-.01,.4],hd);
for(const s of[-1,1]){mesh(SP(.042),dark,[s*.1,.07,.23],hd);mesh(SP(.012),new THREE.MeshBasicMaterial({color:0xffffff}),[s*.1+.012,.085,.265],hd)}
const tg=mesh(SP(.06),M({color:0xe0507a,roughness:.4,clearcoat:.6}),[0,-.17,.31],hd);tg.scale.set(.8,.4,1.2);
const earMat=M({map:furTex,color:0x8a5526,roughness:.9});
const ears=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.23,.1,0);hd.add(g);const e=mesh(SP(.08),earMat,[s*.04,-.14,0],g);e.scale.set(.55,1.9,1);return g});
const gold=M({color:0xffc83a,metalness:1,roughness:.2,emissive:0x553300,emissiveIntensity:.4});
for(let i=0;i<5;i++){const a=i/5*6.283,c=mesh(new THREE.ConeGeometry(.04,.14,8),gold,[Math.sin(a)*.12,.31,Math.cos(a)*.12-.03],hd)}

for(const k in UI){const r=document.createElement('div'),c=document.createElement('div');r.className='r';c.className='c';r.innerHTML=`<span>${LB[k]}</span>`;r.appendChild(c);$('pn').appendChild(r);
  UI[k].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{AP[k](i);[...c.children].forEach((x,j)=>x.classList.toggle('on',j===i))};c.appendChild(b)});
  c.children[0].click()}
$('tg').onclick=()=>{const p=$('pn');p.style.display=p.style.display==='none'?'':'none'};
loop();
</script>
